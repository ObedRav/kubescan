apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-api
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legacy-api
  template:
    metadata:
      labels:
        app: legacy-api
    spec:
      containers:
        - name: api
          image: mycorp/legacy-api:latest
          ports:
            - containerPort: 3000
          # Misconfiguraciones aisladas: se ejecuta como root, permite escalada
          # de privilegios y no fija límites de recursos ni securityContext a
          # nivel de pod. No hay montajes de host, ni namespaces de host, ni
          # contenedor privilegiado: no constituye una cadena de ataque.
          securityContext:
            allowPrivilegeEscalation: true
            runAsUser: 0

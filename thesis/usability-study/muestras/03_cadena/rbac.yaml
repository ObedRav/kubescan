apiVersion: v1
kind: ServiceAccount
metadata:
  name: debug-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: debug-sa-role
# Permisos excesivos: lectura de secretos en todo el clúster y creación de pods,
# habilitando movimiento lateral desde el pod privilegiado.
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["create", "bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: debug-sa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: debug-sa-role
subjects:
  - kind: ServiceAccount
    name: debug-sa
    namespace: kube-system
